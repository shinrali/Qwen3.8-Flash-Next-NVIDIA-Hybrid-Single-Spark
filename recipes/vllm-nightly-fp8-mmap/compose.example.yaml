name: qwen38-flash-next-nightly-fp8-mmap

services:
  qwen38-flash-next:
    image: vllm/vllm-openai:nightly-0cbac6cd1305f710e12193596b27488397bcb205@sha256:8e6e3752946ff2dde451b313cbaec2ea8e7b52221b21bfbcf53fb68dd4f4c42e
    container_name: qwen38-flash-next-nightly-fp8-mmap
    init: true
    restart: "no"
    gpus: all
    ipc: host
    shm_size: 16gb
    entrypoint: [/bin/bash, /patches/apply-and-serve.sh]
    ports:
      - "8000:8000"
    environment:
      TZ: UTC
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY in .env}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_PLE_MMAP_DIR: /root/.cache/vllm/ple_mmap_v030
      VLLM_PLE_MMAP_ADVICE: "1"
      VLLM_MTP_DRAFT_VOCAB: /model/draft_vocab_65536.npy
      VLLM_MTP_DRAFT_HEAD: /model/mtp_draft_head_65536_fp8.safetensors
      VLLM_FP8_HYBRID: "1"
      VLLM_USE_DEEP_GEMM: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      MAMBA_SSM_CACHE_DTYPE: bfloat16
    volumes:
      - ${MODEL_DIR:?set MODEL_DIR in .env}:/model:ro
      - ${CACHE_DIR:-./cache}:/root/.cache
      - ./patches:/patches:ro
    command:
      - --model
      - /model
      - --served-model-name
      - qwen38-flash-next
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --load-format
      - safetensors
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "4"
      - --gpu-memory-utilization
      - "0.01"
      - --kv-cache-memory-bytes
      - "9663676416"
      - --engram-config
      - '{"cpu_offload":true}'
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --enable-chunked-prefill
      - --enable-logging-iteration-details
      - --max-num-batched-tokens
      - "8192"
      - --long-prefill-token-threshold
      - "2048"
      - --long-prefill-token-threshold-adaptive
      - --no-enable-flashinfer-autotune
      - --kv-cache-dtype
      - fp8_e4m3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking":true}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,4]}'
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3,"max_model_len":262144}'
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    stop_grace_period: 2m
