name: nvidia-hybrid-single-spark
services:
  qwen38-flash-next:
    image: nvidia-hybrid-single-spark:latest
    container_name: nvidia-hybrid-single-spark
    init: true
    restart: "no"
    gpus: all
    ipc: host
    shm_size: 16gb
    ports:
      - "30000:8000"
    environment:
      TZ: Australia/Melbourne
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_PLE_MMAP: "1"
      VLLM_PLE_MMAP_WORKERS: "32"
      VLLM_PLE_MMAP_PREWARM: "0"
      VLLM_PLE_MMAP_MADVISE: random
      VLLM_QSA_DET_TOPK: "1"
      VLLM_QSA_DET_LIB: /opt/llm/kernel-det/_C_det.so
      VLLM_QSA_EXACT_TOPK: "0"
      VLLM_MTP_DRAFT_VOCAB: /opt/llm/draft_vocab_65536.npy
      # Required only when the target checkpoint's lm_head is block-FP8.
      VLLM_MTP_DRAFT_HEAD: /model/mtp_draft_head_65536.safetensors
      VLLM_FP8_PAD_M4: "0"
      # Retargeted hybrid shim dispatches NVIDIA ModelOptMixedConfig side
      # layers through vLLM's proven block-FP8 Fp8Config loader.
      VLLM_FP8_HYBRID: "1"
      VLLM_USE_DEEP_GEMM: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    volumes:
      - ${FINAL_MODEL_DIR:?set FINAL_MODEL_DIR}:/model:ro
      - ${CACHE_DIR:?set CACHE_DIR}:/root/.cache
    secrets:
      - llm_api_key
    command:
      - --model
      - /model
      - --served-model-name
      - qwen38-flash-next
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --load-format
      - safetensors
      - --max-model-len
      - "500000"
      - --hf-overrides
      - '{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'
      - --max-num-seqs
      - "8"
      - --gpu-memory-utilization
      - "0.80"
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --enable-chunked-prefill
      - --enable-logging-iteration-details
      - --max-num-batched-tokens
      - "8192"
      - -cc.cudagraph_mode=PIECEWISE
      - '-cc.splitting_ops=["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen3_8_flash_next_ple_short_conv","vllm::qwen3_8_flash_next_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::sparse_attn_indexer","vllm::ple_mmap_lookup"]'
      - --no-enable-flashinfer-autotune
      - --kv-cache-dtype
      - auto
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking":true}'
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3,"max_model_len":500000}'
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    stop_grace_period: 2m
secrets:
  llm_api_key:
    file: ${API_KEY_FILE:?set API_KEY_FILE}
